name: release promote

on:
  # Each hour, moves the release branch stable installs read to the newest preview release that soaked by stable's last
  # move (T5133, tools/release/channels.json): every run from one move to the next picks the same release, so it moves
  # once a day and a late run catches up. By hand with a tag and its sha, it promotes that hotfix at once, no soak; the
  # lead approves the tag and its sha on the release task first.
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The preview release to promote at once, v<MAJOR.MINOR.PATCH> (a hotfix the lead approved)
        type: string
        default: ''
      sha:
        description: The commit the lead approved that tag at
        type: string
        default: ''

permissions:
  contents: read

# One move at a time, and never one cancelled half-way.
concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  promote:
    name: promote to stable
    # Main's tools alone move stable: a run by hand from another branch is skipped, beside the environment's own limit.
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release ruleset lets one actor move the release branch: a deploy key, whose private half is a secret of the
    # release environment, which only main may use. The checkout keeps that key for the push; the job's own token
    # stays read-only, so it can push nothing. The push is a fast-forward without force (tools/release/promote.ts).
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      # No package install and no Node cache, so the move runs on Node alone, from main's own tools/release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The inputs go in by env alone, never into the run line; a scheduled run has none, so both are empty.
      - run: node tools/release/promote-cli.ts --hotfix-tag "$TAG" --hotfix-sha "$SHA"
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
